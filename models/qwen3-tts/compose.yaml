# Qwen3-TTS-12Hz-1.7B-CustomVoice ── 獨立一包：一顆引擎 + 一個 gateway。
#
#   docker compose build          # 引擎十幾 GB，第一次 30-60 分鐘
#   docker compose up -d
#   curl -X POST http://localhost:18003/v1/warmup     # 先把模型載進 GPU
#
# 掛的是 Base checkpoint：上傳一段參考音檔克隆音色，跟另外三包一樣。
#   ./voice.sh add "<名稱>" ~/ref.wav "<逐字稿>"   先建一個音色，回應裡的 voice.id 記下來
#   ./synth.sh "今天天氣真好。" "$VOICE_ID"        再拿那個 id 來合成
#
# ⚠ 這包沒有內建音色 —— 音色庫空的時候合成會回 400，一定要先 add。
# 想要「開箱即用的 9 個精選音色」就把 engine/Dockerfile 的 MODEL_REPO 換回
# Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice、ENGINE_MODES 改成 preset，然後重 build。
# 兩個 checkpoint 只能二選一，Base 沒有 preset、CustomVoice 不會克隆。
#
# port：gateway 18003 對外，引擎 18083 只給除錯。四包的 port 都錯開，
# 可以同時起來（記憶體夠的話）。

name: qwen3-tts

services:

  # ---- gateway：音色庫 + OpenAI 相容 API，唯一該對外的入口 ---------------
  gateway:
    image: tts-qwen3-tts-gateway:gb10
    build:
      context: ./gateway
    init: true
    restart: "no"                    # 測試用：不要在機器重開後自動復活
    # 這台 daemon 沒有設定全域 log rotation（/etc/docker/daemon.json 不存在），
    # 容器的 json log 預設會無限長大，最後撐爆 /var/lib/docker —— 那會連累同機
    # 所有服務（含 3 個 MySQL、1 個 PostgreSQL）。在這裡自己限死，上限 30 MB。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 4g                    # gateway 不吃 GPU，image <200MB，4g 綽綽有餘
    ports:
      # 預設只綁 localhost，機器上的其他人／同網段連不到。
      # 要從別台機器（例如自己的筆電）打這台 GB10 的 API：
      #
      #   BIND_ADDR=0.0.0.0 API_KEY=sk-隨便打一串 docker compose up -d
      #
      # 綁 0.0.0.0 等於整個同網段都連得到，**請務必同時設 API_KEY**，
      # 不然任何人都能用你的 GPU 合成語音、讀寫你的音色庫。
      - "${BIND_ADDR:-127.0.0.1}:18003:8000"
    volumes:
      - ./work/voices:/voices          # 這裡要可寫，音色就存在這
    environment:
      ENGINES: "qwen3-tts=http://engine:8080"
      DEFAULT_ENGINE: qwen3-tts
      REQUEST_TIMEOUT: "600"
      # 設了就會檢查 Authorization: Bearer。空字串 = 不檢查（只綁 localhost 時的預設）。
      # 從 shell 帶進來就好，不用改這個檔： API_KEY=sk-xxxx docker compose up -d
      API_KEY: "${API_KEY:-}"
    depends_on:
      - engine

  # ---- 引擎：吃 GPU、含權重，image 十幾 GB -------------------------------
  engine:
    image: tts-qwen3-tts:gb10
    build:
      context: ./engine
    init: true
    restart: "no"                    # 測試用：不要在機器重開後自動復活
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # CPU 側失控的保險，設寬鬆到不影響任何正常運作。
    #
    # ⚠ 這行**擋不住** GPU 側把 unified memory 吃光。在 GB10 上實測過：
    #   mem_limit 2g 的容器仍能在 GPU 配置 2.79 GiB，容器 cgroup 只計到 0.39 GiB
    #   —— CUDA 走 /dev/nvidia* 的配置不受 memory cgroup 管制。
    #   要避免吃光整台的 unified memory，唯一有效的辦法是「一次只起一包」。
    mem_limit: 32g
    # 引擎預設不對外。直接打它會繞過 gateway 的排隊機制（引擎自己沒有 request
    # queue），同時兩個請求進去可能把記憶體吃爆。要除錯再把下面兩行取消註解。
    # ports:
      # - "18083:8080"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      # 生成參數。這裡設的會蓋掉 Dockerfile 的 ENV，所以調參**不用重 build**，
      # 改完 `docker compose up -d engine` 重啟就生效。
      #
      #   fast      快、最保守，斷句切得碎          （語調偏平）
      #   balanced  預設                            （穩定度與表現力的折衷）
      #   quality   少斷句、語調最連貫，壞掉會重生兩次（最慢）
      # QWEN_PROFILE: balanced
      #
      # 單項覆蓋 profile（不設 = 照 profile 走）：
      # QWEN_TEMPERATURE: "0.8"          # 越低越穩，破音／亂唸就往下調
      # QWEN_REPETITION_PENALTY: "1.1"   # 整段重複唸同一個詞就往上調
      # QWEN_SPLIT_MAX_CHARS: "120"      # 長文斷句的每段字數上限
      # QWEN_RETRIES: "1"                # 產出明顯不對時換 seed 重生幾次
      # QWEN_SEED: "1234"                # 固定 seed，同一句話每次都一樣
      #
      # QWEN_MAX_BATCH: "8"              # ⚠ 往上調會吃光 unified memory，見上面 mem_limit 那段
    volumes:
      # 音色庫。引擎只要讀得到 wav 就好，寫入是 gateway 的事。
      - ./work/voices:/voices:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
