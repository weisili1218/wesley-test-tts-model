# Fun-CosyVoice3-0.5B-2512 ── 獨立一包：一顆引擎 + 一個 gateway，跟其他三包零依賴。
#
#   docker compose build          # 引擎十幾 GB，第一次 30-60 分鐘
#   docker compose up -d
#   curl -X POST http://localhost:18002/v1/warmup     # 先把模型載進 GPU
#
# CosyVoice2 的下一代，克隆品質最好的一顆。一樣是純 zero-shot 克隆、沒有內建音色，
# 所以第一件事是先建一個音色：
#   ./voice.sh add 小美 work/data/xiaomei.m4a "這段音檔的逐字稿。"
#
# port：gateway 18002 對外，引擎 18082 只給除錯。四包的 port 都錯開，
# 可以同時起來（記憶體夠的話）。

name: fun-cosyvoice3

services:

  # ---- gateway：音色庫 + OpenAI 相容 API，唯一該對外的入口 ---------------
  gateway:
    image: tts-fun-cosyvoice3-gateway:gb10
    build:
      context: ./gateway
    init: true
    restart: "no"                    # 測試用：不要在機器重開後自動復活
    # 這台 daemon 沒有設定全域 log rotation（/etc/docker/daemon.json 不存在），
    # 容器的 json log 預設會無限長大，最後撐爆 /var/lib/docker —— 那會連累同機
    # 所有服務（含 3 個 MySQL、1 個 PostgreSQL）。在這裡自己限死，上限 30 MB。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 4g                    # gateway 不吃 GPU，image <200MB，4g 綽綽有餘
    ports:
      # 預設只綁 localhost，機器上的其他人／同網段連不到。
      # 要從別台機器連： BIND_ADDR=0.0.0.0 docker compose up -d
      # （對外開放的話請一併把下面的 API_KEY 打開）
      - "${BIND_ADDR:-127.0.0.1}:18002:8000"
    volumes:
      - ./work/voices:/voices          # 這裡要可寫，音色就存在這
    environment:
      ENGINES: "fun-cosyvoice3=http://engine:8080"
      DEFAULT_ENGINE: fun-cosyvoice3
      REQUEST_TIMEOUT: "600"
      # API_KEY: "sk-xxxx"             # 設了就會檢查 Authorization: Bearer
    depends_on:
      - engine

  # ---- 引擎：吃 GPU、含權重，image 十幾 GB -------------------------------
  engine:
    image: tts-fun-cosyvoice3:gb10
    build:
      context: ./engine
    init: true
    restart: "no"                    # 測試用：不要在機器重開後自動復活
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # CPU 側失控的保險，設寬鬆到不影響任何正常運作。
    #
    # ⚠ 這行**擋不住** GPU 側把 unified memory 吃光。在 GB10 上實測過：
    #   mem_limit 2g 的容器仍能在 GPU 配置 2.79 GiB，容器 cgroup 只計到 0.39 GiB
    #   —— CUDA 走 /dev/nvidia* 的配置不受 memory cgroup 管制。
    #   要避免吃光整台的 unified memory，唯一有效的辦法是「一次只起一包」。
    mem_limit: 32g
    # 引擎預設不對外。直接打它會繞過 gateway 的排隊機制（引擎自己沒有 request
    # queue），同時兩個請求進去可能把記憶體吃爆。要除錯再把下面兩行取消註解。
    # ports:
      # - "18082:8080"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      # autocast(float16)。GB10 是 Blackwell sm_121，同機的 qwen3-tts 用的是 bfloat16，
      # 但 CosyVoice 這條路徑只有開/關兩種，沒有 bf16 選項。預設開；如果聽到雜訊或
      # 破音，改成 "0" 再 docker compose up -d engine 就能比對，不用重 build
      # （server.py 的 get_model() 讀這個值）。
      COSYVOICE_FP16: "1"
      # CosyVoice3 的 LLM 要求輸入含 <|endofprompt|>，這是接在它前面的 system prompt，
      # 預設值跟官方 model card 的範例一致。CosyVoice2 不吃這個。
      COSYVOICE3_SYSTEM_PROMPT: "You are a helpful assistant."
    volumes:
      # 音色庫。引擎只要讀得到 wav 就好，寫入是 gateway 的事。
      - ./work/voices:/voices:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
