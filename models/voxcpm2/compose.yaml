# VoxCPM2 (OpenBMB, 2B) ── 獨立一包：一顆引擎 + 一個 gateway。
#
#   docker compose build          # 引擎十幾 GB，第一次 30-60 分鐘
#   docker compose up -d
#   curl -X POST http://localhost:18004/v1/warmup     # 先把模型載進 GPU
#
# 四包裡功能最全的一顆：音檔克隆 / 純文字描述造音色 / 什麼都不給 三種都支援，
# 輸出 48kHz，30 種語言。也是唯一不用準備音檔就能造出新音色的：
#   ./voice.sh design 溫柔女聲 "一位溫柔的年輕女性，語速偏慢，咬字清楚"
#
# 想再快一點：確認能穩定跑之後，在下面 engine 的 environment 設
# VOXCPM_OPTIMIZE: "1" 開 torch.compile（代價是第一次合成要等編譯）。
#
# port：gateway 18004 對外，引擎 18084 只給除錯。四包的 port 都錯開，
# 可以同時起來（記憶體夠的話）。

name: voxcpm2

services:

  # ---- gateway：音色庫 + OpenAI 相容 API，唯一該對外的入口 ---------------
  gateway:
    image: tts-voxcpm2-gateway:gb10
    build:
      context: ./gateway
    init: true
    restart: "no"                    # 測試用：不要在機器重開後自動復活
    ports:
      # 預設只綁 localhost，機器上的其他人／同網段連不到。
      # 要從別台機器連： BIND_ADDR=0.0.0.0 docker compose up -d
      # （對外開放的話請一併把下面的 API_KEY 打開）
      - "${BIND_ADDR:-127.0.0.1}:18004:8000"
    volumes:
      - ./work/voices:/voices          # 這裡要可寫，音色就存在這
    environment:
      ENGINES: "voxcpm2=http://engine:8080"
      DEFAULT_ENGINE: voxcpm2
      REQUEST_TIMEOUT: "600"
      # API_KEY: "sk-xxxx"             # 設了就會檢查 Authorization: Bearer
    depends_on:
      - engine

  # ---- 引擎：吃 GPU、含權重，image 十幾 GB -------------------------------
  engine:
    image: tts-voxcpm2:gb10
    build:
      context: ./engine
    init: true
    restart: "no"                    # 測試用：不要在機器重開後自動復活
    # 引擎預設不對外。直接打它會繞過 gateway 的排隊機制（引擎自己沒有 request
    # queue），同時兩個請求進去可能把記憶體吃爆。要除錯再把下面兩行取消註解。
    # ports:
      # - "18084:8080"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    volumes:
      # 音色庫。引擎只要讀得到 wav 就好，寫入是 gateway 的事。
      - ./work/voices:/voices:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
